[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-zone-gateway"
version = "0.1.0"
description = "Publish media ingestion, processing, and creator delivery DNS routes through one gateway."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["media_gateway", "migrate_media_zone"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
